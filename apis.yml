aid: uni
name: Uni
description: Uni (Uni Cards) is an Indian consumer credit fintech founded in 2020 by Nitin Gupta,
  Prateek Jindal, and Laxmikant Vyas that delivers clutter-breaking credit products to consumers
  in India, including pay-later style credit cards and flexible repayment products. Uni is backed
  by Lightspeed Venture Partners and General Catalyst. The company is a consumer-facing app-first
  business and does not currently publish a public developer portal or API surface.
